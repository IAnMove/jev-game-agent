name: Source checks
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python jev.py test
      - run: python tools/check_release.py
  linux-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Linux runtime (no emulator or ROM in image)
        run: docker build --platform linux/amd64 -t jev-game-agent:local .
      - name: Obtain official test emulator and generate original test program
        run: |
          mkdir -p "$RUNNER_TEMP/bizhawk"
          curl --fail --location --retry 3 https://github.com/TASEmulators/BizHawk/releases/download/2.11.1/BizHawk-2.11.1-linux-x64.tar.gz -o "$RUNNER_TEMP/bizhawk.tar.gz"
          tar -xzf "$RUNNER_TEMP/bizhawk.tar.gz" -C "$RUNNER_TEMP/bizhawk"
          launcher="$(find "$RUNNER_TEMP/bizhawk" -name EmuHawkMono.sh -print -quit)"
          test -n "$launcher"
          echo "BIZHAWK_DIR=$(dirname "$launcher")" >> "$GITHUB_ENV"
          python tools/smoke_fixture.py
      - name: Verify real bridge, checkpoint determinism and recorded video (zero API)
        run: |
          docker run --rm --init --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --env JEV_ROM=/game/ci-fixture.nes \
            --env JEV_STARTUP_DIAGNOSTICS=1 \
            --env JEV_BIZHAWK=/emulator/EmuHawkMono.sh \
            --mount "type=bind,source=$BIZHAWK_DIR,target=/emulator" \
            --mount "type=bind,source=$PWD/runs,target=/game,readonly" \
            --mount "type=bind,source=$PWD/runs,target=/app/runs" \
            jev-game-agent:local smoke --out runs/ci-smoke
      - name: Show emulator diagnostics if integration fails
        if: failure()
        run: |
          test ! -f runs/ci-smoke/emuhawk_stdout.log || tail -120 runs/ci-smoke/emuhawk_stdout.log
          test ! -f "$BIZHAWK_DIR/EmuHawkMono_laststderr.txt" || tail -120 "$BIZHAWK_DIR/EmuHawkMono_laststderr.txt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-startup-diagnostic
          path: runs/ci-smoke/startup-display.png
          if-no-files-found: ignore
